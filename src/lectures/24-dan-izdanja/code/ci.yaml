# .github/workflows/ci.yaml – Lanin commit od PR-a do commita u config repozitorij
name: ci

on:
  push:
    branches: [main]
  pull_request:                        # PR: lint, testovi, slika i skeniranje – bez slanja u registar

permissions:
  contents: read

env:
  # Klopin registar (u priči registry.klopa.example); ovdje Amazon ECR, kao u 21. predavanju
  REGISTRY: 111122223333.dkr.ecr.eu-central-1.amazonaws.com
  IMAGE: klopa-api

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: pip install ruff && ruff check .

  testovi:                             # bez needs: radi istodobno s lintom
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip                   # ovisnosti iz predmemorije
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  slika:
    needs: [lint, testovi]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write                  # OIDC: kratkotrajni token, bez trajnog ključa
    outputs:
      version: ${{ steps.ver.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"   # npr. 2.0.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Izgradi sliku
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true                   # slika ostaje na runneru za skeniranje
          tags: ${{ env.IMAGE }}:provjera
          cache-from: type=gha         # nepromijenjeni slojevi iz predmemorije
          cache-to: type=gha,mode=max
      - name: Skeniraj sliku           # Trivy mora biti na runneru (npr. aquasecurity/setup-trivy)
        run: trivy image --exit-code 1 --severity CRITICAL "${IMAGE}:provjera"
      - if: github.event_name == 'push'   # pull request samo provjerava
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::111122223333:role/klopa-ci-push
          aws-region: eu-central-1
      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
      - id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true                   # isti slojevi iz predmemorije: samo slanje
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

  staging:
    needs: slika
    if: github.event_name == 'push'    # samo main
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.slika.outputs.version }}
      DIGEST: ${{ needs.slika.outputs.digest }}
      CONFIG_TOKEN: ${{ secrets.KLOPA_CONFIG_TOKEN }}   # smije pisati samo u klopa-config
    steps:
      - name: Bot upisuje tag@digest za staging
        run: |
          git clone "https://ci-bot:${CONFIG_TOKEN}@git.klopa.example/klopa/klopa-config.git" && cd klopa-config
          IMG="${REGISTRY}/${IMAGE}:${VERSION}@${DIGEST}" \
            yq -i '.spec.template.spec.containers[0].image = strenv(IMG)' staging/klopa-api/deployment.yaml
          git -c user.name=ci-bot -c user.email=ci-bot@klopa.example commit -am "ci: staging klopa-api ${VERSION}"
          git push origin HEAD:main      # Argo CD za staging primijeni promjenu

  e2e:
    needs: [slika, staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.slika.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pričekaj da staging vrti novu verziju
        run: until curl -fs https://staging.klopa.example/api/verzija | grep -q "$VERSION"; do sleep 5; done
      - run: E2E_URL=https://staging.klopa.example python -m pytest -q e2e/

  produkcija:
    needs: [slika, e2e]
    runs-on: ubuntu-24.04
    environment: produkcija            # vrata su automatska: bez obveznih odobravatelja, dovoljan je prolaz E2E-a
    env:
      VERSION: ${{ needs.slika.outputs.version }}
      DIGEST: ${{ needs.slika.outputs.digest }}
      CONFIG_TOKEN: ${{ secrets.KLOPA_CONFIG_TOKEN }}
    steps:
      - name: Bot upisuje tag@digest za produkciju
        run: |
          git clone "https://ci-bot:${CONFIG_TOKEN}@git.klopa.example/klopa/klopa-config.git" && cd klopa-config
          IMG="${REGISTRY}/${IMAGE}:${VERSION}@${DIGEST}" \
            yq -i '.spec.template.spec.containers[0].image = strenv(IMG)' apps/klopa-api/deployment.yaml
          git -c user.name=ci-bot -c user.email=ci-bot@klopa.example \
            commit -am "ci: klopa-api ${VERSION} (${DIGEST})"
          git push origin HEAD:main      # izravno na main: Argo CD prati main
