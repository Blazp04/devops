# Secrets Store CSI Driver: vrijednost se dohvaća pri pokretanju Poda i
# montira u tmpfs, bez Kubernetesova Secreta (osim ako uključite secretObjects).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: klopa-sms
  namespace: klopa
spec:
  provider: vault
  parameters:
    vaultAddress: https://trezor.klopa.example:8200
    roleName: klopa-worker
    objects: |
      - objectName: SMS_API_KEY
        secretPath: secret/data/klopa/sms
        secretKey: api-key
# U Deploymentu klopa-worker (spec.template.spec.volumes):
#   - name: tajne
#     csi:
#       driver: secrets-store.csi.k8s.io
#       readOnly: true
#       volumeAttributes:
#         secretProviderClass: klopa-sms
