# U Gitu je samo adresa: koji trezor, koji ključ, koliko često osvježiti.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: klopa-sms
  namespace: klopa
spec:
  refreshInterval: 30s          # bez ovoga ESO osvježava jednom na sat
  secretStoreRef:
    kind: ClusterSecretStore
    name: klopa-trezor
  target:
    name: klopa-sms             # Secret koji ESO stvara i održava
    creationPolicy: Owner
  data:
    - secretKey: SMS_API_KEY
      remoteRef:
        key: klopa/sms          # put u trezoru
        property: api-key
---
# Kako ESO dolazi do trezora (jednom po klasteru). Primjer je OpenBao/Vault;
# za upravitelja tajni u oblaku mijenja se samo blok provider.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: klopa-trezor
spec:
  conditions:                   # samo ovi Namespacei smiju koristiti ovaj trezor
    - namespaces: ["klopa", "klopa-staging"]
  provider:
    vault:                      # OpenBao ima isti API kao Vault
      server: https://trezor.klopa.example:8200
      path: secret
      version: v2
      auth:
        kubernetes:             # prijava identitetom ServiceAccounta, bez lozinke
          mountPath: kubernetes
          role: klopa-eso
