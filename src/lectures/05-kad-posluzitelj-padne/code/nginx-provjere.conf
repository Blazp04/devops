# /etc/nginx/conf.d/klopa.conf – pasivne provjere i ponovni pokušaj
upstream klopa_api {
    zone klopa_api 64k;          # svi procesi NGINX-a dijele brojače i neuspjehe
    least_conn;                  # s težinama: (aktivne veze) ÷ težina
    # zadano: 1 neuspjeli pokušaj (odbijeno, prekinuto, isteklo) → 10 s izvan prometa
    server 10.0.0.11:8000 weight=1 max_fails=1 fail_timeout=10s;   # S1 · Mali
    server 10.0.0.12:8000 weight=2 max_fails=1 fail_timeout=10s;   # S2 · Srednji
    server 10.0.0.13:8000 weight=4 max_fails=1 fail_timeout=10s;   # S3 · Veliki
}

server {
    listen 80;
    server_name klopa.example;

    location / {
        proxy_pass http://klopa_api;
        proxy_set_header Host $host;         # Django provjerava Host (ALLOWED_HOSTS)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout;   # zadano: neuspjeh → sljedeći poslužitelj
        proxy_next_upstream_tries 2;         # najviše jedan ponovni pokušaj
        proxy_connect_timeout 2s;            # zadano 60 s: ugašen stroj = dugo čekanje
    }
}
