apiVersion: v1
kind: Pod
metadata:
  name: klopa-api-1
  namespace: klopa
  labels:
    app: klopa-api
    tier: backend
spec:
  restartPolicy: Always # zadano: srušeni kontejner kubelet ponovno pokreće
  containers:
    - name: klopa-api
      image: registry.klopa.example/klopa-api:1.3.2
      ports:
        - containerPort: 8000
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
      startupProbe:
        httpGet:
          path: /healthz
          port: 8000
        periodSeconds: 10
        failureThreshold: 6 # do 60 s za spori start (puni predmemoriju 40 s)
      livenessProbe:
        httpGet:
          path: /healthz # samo proces – bez baze i ičega izvana
          port: 8000
        periodSeconds: 10
        timeoutSeconds: 3 # sinkroni radnici: ni /healthz ne smije pasti zbog gužve
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /ready # zagrijan i nije preopterećen – bez baze
          port: 8000
        periodSeconds: 10
        failureThreshold: 3
