apiVersion: v1
kind: Pod
metadata:
  name: klopa-api-1
  namespace: klopa
  labels:
    app: klopa-api
spec:
  initContainers:
    - name: wait-for-db # običan init kontejner: mora završiti prije svih ostalih
      image: postgres:18
      command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
    - name: log-shipper # nativni sidecar: init kontejner s restartPolicy: Always
      image: registry.klopa.example/log-shipper:1.0.0
      restartPolicy: Always
      volumeMounts:
        - name: logs
          mountPath: /var/log/klopa
  containers:
    - name: klopa-api
      image: registry.klopa.example/klopa-api:1.3.2
      ports:
        - containerPort: 8000
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: logs
          mountPath: /var/log/klopa
  volumes:
    - name: logs
      emptyDir: {}
