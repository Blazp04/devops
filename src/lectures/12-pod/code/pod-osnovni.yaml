apiVersion: v1
kind: Pod
metadata:
  name: klopa-api-1
  namespace: klopa
  labels:
    app: klopa-api
    tier: backend
spec:
  containers:
    - name: klopa-api
      image: registry.klopa.example/klopa-api:1.3.2
      ports:
        - containerPort: 8000
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
