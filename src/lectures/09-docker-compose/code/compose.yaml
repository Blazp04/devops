# compose.yaml – cijela Klopa na jednom računalu
# (nema ključa version: Compose ga zanemaruje)
name: klopa

services:
  web:
    image: registry.klopa.example/klopa-web:1.3.2
    ports:
      - "8080:8080"            # jedina vrata u zidu: računalo:8080 → web:8080
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    image: registry.klopa.example/klopa-api:1.3.2
    command: sh -c "python manage.py migrate && exec gunicorn --bind 0.0.0.0:8000 klopa.wsgi"
    env_file: .env             # lozinke nisu u ovoj datoteci ni u Gitu
    environment:
      DATABASE_HOST: db        # ime servisa, ne localhost
      REDIS_URL: redis://redis:6379/0
      AMQP_HOST: rabbitmq
    # ports: ["8000:8000"]     # samo privremeno, za otklanjanje grešaka
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  worker:
    image: registry.klopa.example/klopa-worker:1.3.2
    env_file: .env
    environment:
      AMQP_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    env_file: .env             # POSTGRES_USER, POSTGRES_DB, POSTGRES_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql   # postgres:18+: ne …/data!
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3
    env_file: .env             # RABBITMQ_DEFAULT_USER, RABBITMQ_DEFAULT_PASS
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

volumes:
  pgdata:                      # Compose ga stvara kao klopa_pgdata
