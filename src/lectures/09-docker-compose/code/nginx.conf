# web: neprivilegirani nginx sluša na 8080 i prosljeđuje /api/ servisu api
server {
    listen 8080;

    # ugrađeni DNS Dockera; ime "api" pita se svakih 10 s, ne samo pri pokretanju
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
