# /etc/nginx/conf.d/klopa.conf – dva nasumična izbora
upstream klopa_api {
    zone klopa_api 64k;              # svi procesi NGINX-a dijele brojače veza
    random two least_conn;           # dva nasumična; ide onome s manje veza
    server 10.0.0.11:8000 weight=1;
    server 10.0.0.12:8000 weight=2;
    server 10.0.0.13:8000 weight=4;
}

server {
    listen 80;
    server_name klopa.example;

    location / {
        proxy_pass http://klopa_api;
        add_header X-Upstream $upstream_addr always;
    }
}
