# /etc/nginx/conf.d/klopa.conf – težinsko kružno raspoređivanje
upstream klopa_api {
    zone klopa_api 64k; # svi procesi NGINX-a dijele stanje
    server 10.0.0.11:8000 weight=1; # Mali (1 vCPU / 2 GB)
    server 10.0.0.12:8000 weight=2; # Srednji (2 vCPU / 4 GB)
    server 10.0.0.13:8000 weight=4; # Veliki (4 vCPU / 8 GB)
}

server {
    listen 80;
    server_name klopa.example;

    location / {
        proxy_pass http://klopa_api;
        add_header X-Upstream $upstream_addr always;
    }
}
