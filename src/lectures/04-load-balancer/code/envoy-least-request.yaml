# envoy.yaml (isječak): cluster klopa_api = popis poslužitelja iza Envoya
static_resources:
  clusters:
    - name: klopa_api
      type: STATIC
      connect_timeout: 1s
      lb_policy: LEAST_REQUEST    # uz jednake težine: dva nasumična izbora
      load_assignment:
        cluster_name: klopa_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 10.0.0.11, port_value: 8000 }
              - endpoint:
                  address:
                    socket_address: { address: 10.0.0.12, port_value: 8000 }
              - endpoint:
                  address:
                    socket_address: { address: 10.0.0.13, port_value: 8000 }
