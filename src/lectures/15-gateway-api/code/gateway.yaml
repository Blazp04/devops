# Gateway: vrata u klaster. Piše ga operater klastera (Davor).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: klopa-gw
  namespace: klopa
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: klopa-tls
      allowedRoutes:
        namespaces:
          from: Same
