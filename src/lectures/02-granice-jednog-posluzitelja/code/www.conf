; pool.d/www.conf – isti bazen radnika u PHP-FPM-u
[www]
user = www-data
group = www-data
listen = /run/php/php-fpm.sock

pm = dynamic
; najviše procesa (radnika): (2048 MB − 512 MB) / 256 MB
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; kad su svi zauzeti, novi zahtjevi čekaju, a u dnevniku piše:
; WARNING: [pool www] server reached pm.max_children setting (6), consider raising it
